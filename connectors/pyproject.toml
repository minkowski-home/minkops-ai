[project]
name = "minkops-connectors"
version = "0.1.0"
description = "External-system adapters for Minkops"
requires-python = ">=3.12"
dependencies = ["aiosmtplib>=5.1.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/minkops_connectors"]
