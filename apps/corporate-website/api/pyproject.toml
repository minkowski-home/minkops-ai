[project]
name = "corporate-website-api"
version = "0.1.0"
description = "FastAPI backend for corporate website"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosmtplib>=3.0.0",
    "fastapi>=0.115",
    "uvicorn>=0.53.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/minkops_corporate_website_api"]
