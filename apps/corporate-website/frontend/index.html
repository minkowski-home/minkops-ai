<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />

    <!-- Defaults for crawlers that don't run JavaScript. Each route overwrites these via SeoHead. -->
    <title>Minkops · The operating system for zero-man companies</title>
    <meta
      name="description"
      content="Minkops organizes AI Employees around practical business Workflows, with skills, approved tools, connectors and human review."
    />
    <meta property="og:site_name" content="Minkops" />
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Minkops · The operating system for zero-man companies"
    />
    <meta
      property="og:description"
      content="Minkops organizes AI Employees around practical business Workflows, with explicit tool access and human review."
    />
    <meta property="og:url" content="https://minkops.com/" />
    <link rel="canonical" href="https://minkops.com/" />

    <!-- The brand has no logo artwork; the favicon is the Ember dot from the wordmark lockup. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Readex Pro (display + wordmark), Libre Franklin (text), IBM Plex Mono (machine values). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Libre+Franklin:ital,wght@0,300..800;1,400..600&family=Readex+Pro:wght@500;600;700&display=swap"
    />
  </head>

  <body>
    <noscript>
      Minkops organizes AI Employees around practical business Workflows. This site needs JavaScript to run; you
      can reach us any time at info@minkops.com.
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
