[project]
name = "minkops-solution-api"
version = "0.1.0"
description = "Shared Minkops solution API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "email-validator>=2.2.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "jsonschema>=4.25.0",
    "openai>=3.19.0",
    "openpyxl>=3.1.5",
    "psycopg[binary]>=3.3.3",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "pwdlib[argon2]>=0.3.0",
    "uvicorn>=0.53.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/minkops_api"]
