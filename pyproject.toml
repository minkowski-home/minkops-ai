[tool.uv.workspace]
members = [
    "apps/solution-api",
    "apps/corporate-website/api",
    "db",
    "platform",
    "connectors",
]

# Development tools shared by every workspace project; production images sync
# with --no-dev and never install them.
[dependency-groups]
dev = ["ruff==0.17.1", "pillow==12.0.0", "qrcode==8.2", "cryptography==50.0.2"]

[tool.pytest.ini_options]
# Anchor the rootdir here for every invocation. Otherwise a run of one file
# under a workspace package roots at that package's pyproject.toml, skips the
# root conftest and leaves database tests pointed at the server's own database.
testpaths = ["platform/tests", "apps/solution-api/tests", "connectors/tests", "db/tests",
             "apps/corporate-website/api/tests", "infra/tests", "scripts/tests"]
# A bill-entry desk whose company has GST switched on in Tally.
markers = ["gst: the desk's company is GST-registered in Tally"]
