name: Validate
on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [staging, main]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: minkops
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
          python-version: "3.12"
      - run: uv sync --frozen --all-packages
      - run: uv run --all-packages pytest platform/tests apps/solution-api/tests connectors/tests db/tests apps/corporate-website/api/tests infra/tests -q --tb=short
        env:
          TEST_DATABASE_URL: postgresql://minkops:test-only-password@localhost:5432/postgres
          AUTH_DEV_MODE: "1"
  frontend-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
        working-directory: connectors/desktop
      - run: npm ci && npm test && npm run build && npm run lint
        working-directory: apps/solution-web
      - run: npm ci && npm run build
        working-directory: apps/corporate-website/frontend
      - run: npm ci && npm test && npm run build
        working-directory: apps/windows-app
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f infra/solution.Dockerfile -t minkops-solution:review .
      - run: docker run --rm minkops-solution:review python -m minkops_api.install_workflows mock-client --validate-only
