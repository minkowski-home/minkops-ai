[project]
name = "minkops-platform"
version = "0.1.0"
description = "Reusable application services for Minkops"
requires-python = ">=3.12"
dependencies = ["minkops-connectors"]

[tool.uv.sources]
minkops-connectors = { path = "../connectors", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/minkops_platform"]
