[project]
name = "minkops-platform"
version = "0.1.0"
description = "Reusable Minkops application services"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.25.0", "psycopg[binary]>=3.3.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/minkops_platform"]
