<link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;background:var(--surface-page);color:var(--text-primary)}.lbl{font:var(--type-eyebrow);letter-spacing:var(--ls-eyebrow);text-transform:uppercase;color:var(--text-muted)}.hex{font:var(--type-mono);color:var(--text-muted)}.ramp{display:grid;grid-template-columns:repeat(12,1fr);gap:4px}.c{display:grid;gap:6px}.s{height:56px;border-radius:var(--radius-1);border:1px solid var(--border-hairline)}.c span{font:var(--fw-regular) 9px/1 var(--font-mono);color:var(--text-muted);text-align:center}</style>
