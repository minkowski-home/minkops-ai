<!-- @dsCard group="Brand" viewport="700x270" name="Wordmark lockups" subtitle="Supplied orange and slate artwork, plus the compact typeset app wordmark." -->
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 18px; background: var(--surface-page); color: var(--text-primary); }
  h2 { font: var(--type-title); margin-bottom: 12px; }
  .samples { display: flex; align-items: flex-start; gap: 20px; flex-wrap: wrap; }
  figure { margin: 0; }
  img { display: block; width: 155px; height: 155px; border: 1px solid var(--border-default); }
  figcaption { margin-top: 8px; font: var(--type-label); color: var(--text-secondary); }
  .app-mark { width: 190px; height: 155px; display: flex; align-items: center; padding: 14px; border: 1px solid var(--border-default); background: var(--surface-sunken); }
  .wordmark { font: var(--fw-wordmark) 24px/1 var(--font-wordmark); letter-spacing: var(--ls-wordmark); }
  .dot { display: inline-block; width: 8px; height: 8px; margin-right: 9px; border-radius: 50%; background: var(--signal-live); }
</style>
<h2>Wordmark</h2>
<div class="samples">
  <figure><img src="../assets/logos/logo-orange.PNG" alt="Orange Minkops logo"><figcaption>Minkops variant</figcaption></figure>
  <figure><img src="../assets/logos/logo-slate.PNG" alt="Slate Minkops logo"><figcaption>Slate variant</figcaption></figure>
  <figure><div class="app-mark"><span><span class="dot"></span><span class="wordmark">minkops</span></span></div><figcaption>Compact app header</figcaption></figure>
</div>
