<link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;background:var(--surface-page);color:var(--text-primary)}.lbl{font:var(--type-eyebrow);letter-spacing:var(--ls-eyebrow);text-transform:uppercase;color:var(--text-muted)}.hex{font:var(--type-mono);color:var(--text-muted)}.row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.p{padding:14px;border-radius:var(--radius-3);display:grid;gap:6px;min-height:100px;align-content:start}</style>
<div class="row">
<div class="p" style="background:var(--surface-page);border:1px solid var(--border-default)"><span class="lbl">Page</span><b style="font:var(--type-body-sm);color:var(--text-primary)">Primary ink</b><span style="font:var(--type-body-sm);color:var(--text-secondary)">Secondary</span><span style="font:var(--type-body-sm);color:var(--text-muted)">Muted</span></div>
<div class="p" style="background:var(--surface-sunken);border:1px solid var(--border-hairline)"><span class="lbl">Sunken</span><b style="font:var(--type-body-sm)">#f8f9fa</b><span class="hex">panes, wells, agent bubbles</span></div>
<div class="p" style="background:var(--surface-inset);border:1px solid var(--border-hairline)"><span class="lbl">Inset</span><b style="font:var(--type-body-sm)">#f1f3f5</b><span class="hex">icon tiles, quiet fills</span></div>
<div class="p" style="background:var(--surface-inverse);border:1px solid var(--surface-inverse)"><span class="lbl" style="color:var(--text-inverse-muted)">Inverse</span><b style="font:var(--type-body-sm);color:var(--text-inverse)">Graphite band</b><span class="hex" style="color:var(--text-inverse-muted)">#424048 · footers, sidebars</span></div>
</div>
