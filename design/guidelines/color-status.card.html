<!-- @dsCard group="Colors" viewport="700x150" name="Status colors" subtitle="Desaturated on purpose — they sit beside Ember without fighting it." -->
<link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;background:var(--surface-page);color:var(--text-primary)}.lbl{font:var(--type-eyebrow);letter-spacing:var(--ls-eyebrow);text-transform:uppercase;color:var(--text-muted)}.hex{font:var(--type-mono);color:var(--text-muted)}.row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.chip{padding:12px 14px;border-radius:var(--radius-3);display:grid;gap:4px}.chip b{font:var(--fw-semibold) var(--fs-sm)/1.2 var(--font-text)}</style>
<div class="row">
<div class="chip" style="background:var(--status-ok-fill);border:1px solid rgba(31,111,69,.2)"><b style="color:var(--status-ok)">Resolved</b><span class="hex">--status-ok #1f6f45</span></div>
<div class="chip" style="background:var(--status-warn-fill);border:1px solid rgba(138,98,18,.22)"><b style="color:var(--status-warn)">Needs review</b><span class="hex">--status-warn #8a6212</span></div>
<div class="chip" style="background:var(--status-alert-fill);border:1px solid rgba(179,38,30,.22)"><b style="color:var(--status-alert)">Escalation</b><span class="hex">--status-alert #b3261e</span></div>
<div class="chip" style="background:var(--status-info-fill);border:1px solid var(--border-default)"><b style="color:var(--status-info)">Informational</b><span class="hex">--status-info #4d5661</span></div>
</div>
