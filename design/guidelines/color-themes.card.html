<!-- @dsCard group="Colors" viewport="700x250" name="App themes" subtitle="Four theme choices using the locked orange, rust, slate, and graphite palette." -->
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 18px; background: var(--surface-page); color: var(--text-primary); }
  .bar, .preview { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .bar { margin-bottom: 16px; }
  label { font: var(--type-label); }
  select { margin-left: 8px; padding: 7px 10px; border: 1px solid var(--border-default); background: var(--surface-raised); color: var(--text-primary); }
  .preview { padding: 20px; border: 1px solid var(--border-default); background: var(--surface-sunken); }
  .card { flex: 1; padding: 16px; border: 1px solid var(--border-default); background: var(--surface-raised); }
  .card strong { display: block; margin-bottom: 5px; font-family: var(--font-display); }
  .card p { color: var(--text-secondary); }
  button { flex: none; padding: 10px 14px; border: 1px solid var(--action-primary-bg); background: var(--action-primary-bg); color: var(--action-primary-fg); cursor: pointer; }
  .signal { display: inline-block; width: 8px; height: 8px; margin-right: 7px; border-radius: 50%; background: var(--signal-live); }
</style>
<div class="bar"><h2>App themes</h2><label>Theme<select id="theme"><option value="minkops-light">Minkops Light</option><option value="minkops-dark">Minkops Dark</option><option value="slate-light">Slate Light</option><option value="slate-dark">Slate Dark</option></select></label></div>
<div class="preview"><div class="card"><strong><span class="signal"></span>Image desk</strong><p>Active employee · Image to Excel</p></div><button>View workflow</button></div>
<script>document.getElementById('theme').addEventListener('change', event => { document.documentElement.dataset.theme = event.target.value; });</script>
