<!-- @dsCard group="Brand" viewport="700x150" name="Signal vocabulary" subtitle="What a Minkops surface can say about a running agent." -->
<link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;background:var(--surface-page);color:var(--text-primary)}.lbl{font:var(--type-eyebrow);letter-spacing:var(--ls-eyebrow);text-transform:uppercase;color:var(--text-muted)}.hex{font:var(--type-mono);color:var(--text-muted)}.r{display:flex;gap:26px;align-items:center;flex-wrap:wrap}.i{display:flex;align-items:center;gap:8px;font:var(--type-eyebrow);letter-spacing:var(--ls-wide);text-transform:uppercase;color:var(--text-muted)}.d{width:7px;height:7px;border-radius:50%}</style>
<div class="r">
<span class="i"><span class="d" style="background:var(--signal-live);box-shadow:0 0 0 3px var(--ember-tint-14)"></span>active</span>
<span class="i"><span class="d" style="background:var(--signal-idle)"></span>idle</span>
<span class="i"><span class="d" style="background:var(--signal-off)"></span>disabled</span>
<span class="i"><span class="d" style="background:var(--status-alert)"></span>error</span>
<span class="i"><span class="d" style="background:var(--status-ok)"></span>resolved</span>
</div>
<p class="hex" style="margin-top:14px">Ember = running now. Green never means "active" — only a finished, good outcome.</p>
