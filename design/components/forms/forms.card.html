<!-- @dsCard group="Components" viewport="700x400" name="Forms" subtitle="Field, input, textarea, select, option rows" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Form components</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{padding:18px;background:var(--surface-page)}.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}.grid{display:grid;gap:10px}.sect{display:grid;gap:8px;padding-bottom:14px;margin-bottom:14px;border-bottom:1px solid var(--border-hairline)}.sect:last-child{border:0;margin:0;padding:0}</style>
</head><body><div id="root"></div><script type="text/babel">
const { Button, IconButton, Icon, Badge, PriorityPill, StatusDot, Toggle, Card, Avatar, Eyebrow, Field, Input, Textarea, Select, OptionRow, ProgressSteps, EmptyState, TypingIndicator, AgentRow, InterruptCard, MessageBubble, AgentTile, FlowNode, FlowArrow } = window.MinkopsDesignSystem_6c27f0;

function Demo(){
  const [sel,setSel]=React.useState(['support']);
  const toggle=(v)=>setSel(s=>s.includes(v)?s.filter(x=>x!==v):[...s,v]);
  return <div className="grid" style={{gap:0}}>
    <div className="sect" style={{gridTemplateColumns:'1fr 1fr',display:'grid',gap:12}}>
      <Field label="Full name" htmlFor="n" required><Input id="n" placeholder="Sarah Connor"/></Field>
      <Field label="Work email" htmlFor="e" required error="Enter a company address."><Input id="e" invalid defaultValue="sarah@"/></Field>
      <Field label="Primary interest" htmlFor="i"><Select id="i" options={[{value:'general',label:'General enquiry'},{value:'support',label:'Customer support'},{value:'sales',label:'Sales & lead gen'}]}/></Field>
      <Field label="Tenant id" htmlFor="t" hint="Mono input for machine values."><Input id="t" mono size="sm" defaultValue="tenant_001"/></Field>
    </div>
    <div className="sect">
      <Field label="Message" htmlFor="m" hint="Enter to send · Shift+Enter for new line">
        <Textarea id="m" rows={2} placeholder="Describe a task for your agents…"/>
      </Field>
    </div>
    <div className="sect"><Eyebrow rule>OptionRow — multi select</Eyebrow>
      <div className="grid" style={{gap:8}}>
        <OptionRow multi label="Answering customer support calls & tickets" selected={sel.includes('support')} onSelect={()=>toggle('support')}/>
        <OptionRow multi label="Following up on leads and abandoned carts" selected={sel.includes('leads')} onSelect={()=>toggle('leads')}/>
        <OptionRow label="$2,000 – $15,000" meta="Growth" selected={false} onSelect={()=>{}}/>
      </div>
    </div>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script></body></html>
