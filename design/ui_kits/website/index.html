<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Minkops — Intelligence, redefined</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0}</style>
</head><body><div id="root"></div>
<script type="text/babel" src="SiteChrome.jsx"></script>
<script type="text/babel" src="Landing.jsx"></script>
<script type="text/babel" src="Funnel.jsx"></script>
<script type="text/babel" src="AccessSection.jsx"></script>
<script type="text/babel" src="Orchestration.jsx"></script>
<script type="text/babel" src="EditorialPages.jsx"></script>
<script type="text/babel">
function SiteApp() {
  const [route, setRoute] = React.useState("agents");
  const go = (r) => { setRoute(r === "access" ? "agents" : r); window.scrollTo(0, r === "access" ? document.body.scrollHeight : 0); };
  return (
    <div style={{ minHeight: "100vh", display: "flex", flexDirection: "column", background: "var(--surface-page)" }}>
      <SiteNav route={route} onRoute={go} />
      <main style={{ flex: 1 }}>
        {route === "agents" ? (
          <>
            <Hero onAccess={() => go("access")} />
            <Funnel onAccess={() => go("access")} />
            <RosterGrid onAccess={() => go("access")} />
            <AccessSection />
          </>
        ) : route === "orchestration" ? <OrchestrationPage onAccess={() => go("access")} />
          : route === "about" ? <AboutPage />
          : route === "blog" ? <BlogPage />
          : <CareersPage />}
      </main>
      <SiteFooter />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<SiteApp />);
</script></body></html>
