services:
  app_db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: minkops_app
      POSTGRES_USER: minkops
      POSTGRES_PASSWORD: ${MINKOPS_DB_PASSWORD:-minkops-local}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - minkops_app:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minkops -d minkops_app"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  minkops_app:
